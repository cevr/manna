pre-commit:
  jobs:
    # Budget: under 5 s. Only the staged files are linted (with fixes) and
    # formatted; stage_fixed re-stages what the tools rewrote. Then the
    # workspaces the staged files lie in are typechecked, incrementally
    # (packages/scripts/src/precommit-typecheck.ts), and the lessons ledger is
    # checked. The gate (lint, the lessons ledger and unit tests) runs by hand
    # between units; builds and the slow tests are `bun run test:slow`.
    - name: lint
      glob: '*.{ts,tsx,js,jsx,mts,cts}'
      run: bun x oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: fmt
      run: bun x oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: typecheck
      run: bun packages/scripts/src/precommit-typecheck.ts

    # The lessons ledger (`docs/lessons.md`) held to the files its guards name
    # (packages/scripts/src/lessons/check.ts), on every commit and not on a
    # glob: a test renamed in any file can break an entry that names it. It
    # reads the working tree, as the typecheck does, in about 0.15 s.
    - name: lessons
      run: bun packages/scripts/src/lessons/check.ts

    # Guard rail: a render carries the film's mix, and the mix carries the
    # generated score and effects, so no video (or m4a) is committed under the
    # films or their framework. The only ones allowed are the renderer's test
    # segments (packages/film/src/tools/fixtures), which carry a test tone.
    # Renders live in apps/animations/out (ignored) and the private media store.
    - name: no-renders
      glob: '{apps/animations,packages/film}/**.{mp4,m4v,mov,webm,mkv,m4a,MP4,MOV}'
      exclude:
        - 'packages/film/src/tools/fixtures/*.mp4'
        # A cast member's reference clip (its manifest's `clips`): the reader is scored on it.
        - 'apps/animations/src/library/cast/*/cutout/*/clip/*.mp4'
      run: |
        echo "Renders may not be committed (they carry the generated score):"
        printf '  %s\n' {staged_files}
        echo "Keep renders in apps/animations/out or the media store (film media push)."
        exit 1
