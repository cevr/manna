[project]
name = "film-reader"
version = "0.1.0"
description = "The cast reader: joints and the nearest drawing from a frame, trained on a member's synthetic renders"
requires-python = "==3.12.*"
dependencies = [
  "torch==2.15.0",
  "transformers==5.22.0",
  "numpy==2.5.4",
  "pillow==13.0.0",
  "opencv-python-headless==5.0.0.93",
  "modal==1.6.3",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
package = false
no-build = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
